name: Build Artifacts

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          server-id: ossrh # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: actions/checkout@v4
      - name: 'Create settings.xml'
        uses: s4u/maven-settings-action@v3.0.0
        with:
          githubServer: false
      - name: Build with Maven
        run: mvn clean package -e -pl \!nms,\!nms/common,\!nms/v1_8_r3,\!nms/v1_9_r2,\!nms/v1_10_r1,\!nms/v1_11_r1,\!nms/v1_12_r1,\
          \!nms/v1_13_r2,\!nms/v1_14_r1,\!nms/v1_15_r1,\!nms/v1_16_r3,\!nms/v1_17_r1,\!nms/v1_18_r1,\!nms/v1_18_r2,\
          \!nms/v1_19_r1,\!nms/v1_19_r2,\!nms/v1_19_r3,\!nms/v1_20_r1,\!nms/v1_20_r2,\!nms/v1_20_r3,\!nms/v1_20_r4,\
          \!nms/v1_21_r1,\!nms/v1_21_r2,\!nms/v1_21_r3